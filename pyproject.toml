[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainxdl-open"
version = "0.1.0"
description = "An open research framework for explainable deep learning on brain connectivity networks."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  {name = "Sin-Yee Yap"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "dill>=0.3.6",
  "matplotlib>=3.7",
  "numpy>=1.24,<2",
  "pandas>=1.5",
  "PyYAML>=6",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.1",
  "torch-geometric>=2.4",
  "tqdm>=4.65",
]

[project.urls]
Homepage = "https://brainxdl.yapsinyee.com"
Repository = "https://github.com/yapsinyee/BrainXDL-Open"

[project.optional-dependencies]
xai = [
  "mne>=1.5",
  "nibabel>=5.1",
  "nilearn>=0.10",
  "pillow>=10",
  "pyvista>=0.42",
  "umap-learn>=0.5",
]
harmonization = ["neuroCombat>=0.2.12"]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["brainxdl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
